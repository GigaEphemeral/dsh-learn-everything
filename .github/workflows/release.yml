name: Release Package

on:
  push:
    tags:
      - 'v*' # 只有推送类似 v0.1.0 的 tag 时才触发

permissions:
  contents: write # 需要写入权限才能创建 Release 并上传文件
  id-token: write # npm --provenance 需要（供应链溯源）

jobs:
  build:
    runs-on: ubuntu-latest
    env: # job 级暴露，供 Publish 步骤的 if: env.NPM_PUBLISH != '' 判断（step 级 env 对自身 if 不可见）
      NPM_PUBLISH: ${{ secrets.NPM_PUBLISH }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        registry-url: 'https://registry.npmjs.org/' # 有值时 setup-node 才写 npmrc（main.ts:60-63）
      env: # npmrc 里是 _authToken=${NODE_AUTH_TOKEN}，值取自本步骤 env（authutil.ts）
        NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH }}

    - name: Install Dependencies
      run: npm ci

    - name: Run Tests
      run: npm test # 失败即中止，不发版

    - name: Verify tag matches package version
      run: |
        PKG_VER=$(node -p "require('./package.json').version")
        TAG_VER=${GITHUB_REF_NAME#v}
        if [ "$PKG_VER" != "$TAG_VER" ]; then
          echo "::error::tag v$TAG_VER 与 package.json $PKG_VER 不一致"
          exit 1
        fi

    - name: Build & Package
      run: |
        npm run build
        npm run build:client
        mkdir -p dist
        npm pack --pack-destination dist/ # 产物集中放 dist/，避免通配符误伤

    - name: Create Release and Upload Asset
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*.tgz
        body_path: CHANGELOG.md # Release 正文用 CHANGELOG，保持与仓库记录一致

    - name: Publish to npm
      if: startsWith(github.ref, 'refs/tags/v') && env.NPM_PUBLISH != ''
      run: npm publish --provenance --access public # secret 名：NPM_PUBLISH（Granular Access Token，Read and write）
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH }}
