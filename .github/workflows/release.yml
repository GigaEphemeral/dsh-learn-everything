name: Release Package

on:
  push:
    tags:
      - 'v*' # 只有推送类似 v0.1.0 的 tag 时才触发

permissions:
  contents: write # 需要写入权限才能创建 Release 并上传文件

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run Tests
      run: npm test # 失败即中止，不发版

    - name: Verify tag matches package version
      run: |
        PKG_VER=$(node -p "require('./package.json').version")
        TAG_VER=${GITHUB_REF_NAME#v}
        if [ "$PKG_VER" != "$TAG_VER" ]; then
          echo "::error::tag v$TAG_VER 与 package.json $PKG_VER 不一致"
          exit 1
        fi

    - name: Build & Package
      run: |
        npm run build
        npm run build:client
        npm pack --pack-destination dist/ # 产物集中放 dist/，避免通配符误伤

    - name: Create Release and Upload Asset
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*.tgz
        generate_release_notes: true
