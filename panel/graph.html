<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>知识图谱</title>
<!-- Self-hosted open-source graph library (vis-network, MIT): the panel
     works without reaching a CDN. -->
<script src="./vis-network.min.js"></script>
<style>
  /* Light is the default palette; html[data-theme='dark'] flips it. The panel
     iframe is a separate document, so it carries its own palette instead of
     reading DSH tokens. */
  :root{
    color-scheme:light;
    --graph-bg:#ffffff;
    --graph-fg:#1f2329;
    --graph-muted:#5b6270;
    --graph-line:#d9dde4;
    --graph-panel:#f6f7f9;
    --graph-link:#1a63d8;
    --graph-button-bg:#eef1f5;
    --graph-button-fg:#1f2329;
    --graph-button-border:#c9d0da;
    --graph-button-hover:#e2e7ee;
    --graph-status-error:#c62828;
  }
  html[data-theme='dark']{
    color-scheme:dark;
    --graph-bg:#15181c;
    --graph-fg:#e7e9ec;
    --graph-muted:#a3aab5;
    --graph-line:#313841;
    --graph-panel:#1b1f24;
    --graph-link:#6cb6ff;
    --graph-button-bg:#262c33;
    --graph-button-fg:#e7e9ec;
    --graph-button-border:#3a424c;
    --graph-button-hover:#30373f;
    --graph-status-error:#ff8f8f;
  }
  html,body{margin:0;height:100%;font-family:-apple-system,Segoe UI,sans-serif;background:var(--graph-bg);color:var(--graph-fg)}
  #app{display:flex;height:100%}
  #graph{flex:1;height:100%;min-width:0}
  #info{width:260px;border-left:1px solid var(--graph-line);background:var(--graph-panel);padding:10px;overflow:auto;font-size:13px;box-sizing:border-box}
  #info h3{margin:0 0 8px;font-size:14px;word-break:break-word}
  #info .type{color:var(--graph-muted);font-size:12px}
  #info .path{margin-top:6px;word-break:break-all;color:var(--graph-muted)}
  #status{position:absolute;left:16px;top:16px;font-size:12px;color:var(--graph-muted);background:var(--graph-bg)}
  #status.error{color:var(--graph-status-error)}
  a{color:var(--graph-link)}
  button{background:var(--graph-button-bg);color:var(--graph-button-fg);border:1px solid var(--graph-button-border);border-radius:4px;padding:4px 10px;margin-top:8px;cursor:pointer}
  button:hover{background:var(--graph-button-hover)}
</style>
</head>
<body>
<div id="app">
  <div id="graph"></div>
  <div id="info"><h3>知识图谱</h3><div>加载中…</div></div>
</div>
<script>
  // The page owns its data read: the panel embeds this page without a query
  // payload, so a large graph never exceeds the host's request-line limit.
  // Same-origin cookies authenticate the fenced route.

  // The panel passes ?theme=dark|light; otherwise fall back to the same-origin
  // parent document's dark-only body attribute. Resolved before the first
  // render so the vis-network canvas picks up palette colors.
  function resolveTheme() {
    var params = new URLSearchParams(location.search);
    var requested = params.get('theme');
    if (requested === 'dark' || requested === 'light') return requested;
    try {
      return window.parent.document.body.hasAttribute('data-ds-dark-theme') ? 'dark' : 'light';
    } catch (error) {
      return 'light';
    }
  }
  document.documentElement.dataset.theme = resolveTheme();

  // vis-network paints on a canvas, so it cannot consume CSS variables: read
  // the active palette through getComputedStyle instead.
  function readPalette() {
    var styles = getComputedStyle(document.documentElement);
    function token(name, fallback) {
      var value = styles.getPropertyValue(name);
      return value && value.trim() ? value.trim() : fallback;
    }
    return {
      label: token('--graph-fg', '#1f2329'),
      line: token('--graph-line', '#d9dde4'),
      link: token('--graph-link', '#1a63d8'),
    };
  }

  var network = null;
  var currentNodes = [];
  var statusLine = document.createElement('div');
  statusLine.id = 'status';
  document.body.appendChild(statusLine);

  function setStatus(text, error) {
    statusLine.textContent = text || '';
    statusLine.className = error ? 'error' : '';
  }

  function colorFor(type) {
    return { concept: '#4fc3f7', entity: '#81c784', source: '#ffb74d', other: '#9aa3ad' }[type] || '#9aa3ad';
  }

  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

  function showInfo(node) {
    var info = document.getElementById('info');
    clear(info);
    var title = document.createElement('h3');
    title.textContent = node.label || node.id;
    var type = document.createElement('div');
    type.className = 'type';
    type.textContent = '类型：' + (node.type || 'other');
    var path = document.createElement('div');
    path.className = 'path';
    path.textContent = '路径：' + node.id;
    var button = document.createElement('button');
    button.textContent = '在 Obsidian 打开';
    button.addEventListener('click', function () {
      var vault = new URLSearchParams(location.search).get('vault');
      var target = 'obsidian://open?file=' + encodeURIComponent(node.id)
        + (vault ? '&vault=' + encodeURIComponent(vault) : '');
      window.open(target, '_blank', 'noopener');
    });
    info.appendChild(title);
    info.appendChild(type);
    info.appendChild(path);
    info.appendChild(button);
    window.parent.postMessage({ source: 'wiki-graph', type: 'node-click', id: node.id }, location.origin);
  }

  function render(data) {
    var container = document.getElementById('graph');
    var palette = readPalette();
    var nodesInput = Array.isArray(data && data.nodes)
      ? data.nodes.filter(function (n) { return n && typeof n.id === 'string' && n.id; })
      : [];
    var edgesInput = Array.isArray(data && data.edges) ? data.edges : [];
    currentNodes = nodesInput;
    if (nodesInput.length === 0 || typeof vis === 'undefined' || !vis.Network) {
      if (network) { network.destroy(); network = null; }
      clear(container);
      var info = document.getElementById('info');
      clear(info);
      var title = document.createElement('h3');
      title.textContent = '知识图谱';
      var empty = document.createElement('div');
      empty.textContent = nodesInput.length === 0 ? '无图谱数据（wiki 为空或尚未生成）。' : '图谱库未能加载（panel/vis-network.min.js）。';
      info.appendChild(title);
      info.appendChild(empty);
      setStatus(nodesInput.length === 0 ? '无图谱数据。' : '图谱库未能加载。', nodesInput.length !== 0);
      return;
    }
    setStatus(nodesInput.length + ' 个节点 · ' + edgesInput.length + ' 条边');
    var nodes = new vis.DataSet(nodesInput.map(function (n) {
      return { id: n.id, label: n.label || n.id, group: n.type, title: n.id, color: colorFor(n.type) };
    }));
    var edges = new vis.DataSet(edgesInput
      .filter(function (e) { return e && e.source && e.target; })
      .map(function (e, i) { return { id: i, from: e.source, to: e.target }; }));
    if (network === null) {
      network = new vis.Network(container, { nodes: nodes, edges: edges }, {
        nodes: { shape: 'dot', size: 14, font: { color: palette.label, size: 13 } },
        edges: { color: { color: palette.line, highlight: palette.link }, arrows: { to: { enabled: true, scaleFactor: 0.4 } } },
        physics: { enabled: true, solver: 'forceAtlas2Based', stabilization: { iterations: 200 } },
        interaction: { hover: true },
      });
      network.on('click', function (event) {
        var id = event.nodes[0];
        if (!id) return;
        var node = currentNodes.find(function (n) { return n.id === id; });
        if (node) showInfo(node);
      });
    } else {
      network.setData({ nodes: nodes, edges: edges });
    }
  }

  // Registered once per page: re-registering it inside render() multiplied
  // listeners (and renders) on every parent push.
  window.addEventListener('message', function (event) {
    if (event.origin !== location.origin) return;
    if (event.data && event.data.source === 'wiki-graph' && event.data.type === 'data') render(event.data.graph);
  });

  function load() {
    setStatus('加载中…');
    fetch(new URL('graph', location.href), { headers: { accept: 'application/json' }, credentials: 'same-origin' })
      .then(function (res) {
        return res.json().then(function (body) { return { res: res, body: body }; });
      })
      .then(function (answer) {
        if (!answer.res.ok || !answer.body || answer.body.ok !== true) {
          var message = (answer.body && answer.body.error && answer.body.error.message) || ('HTTP ' + answer.res.status);
          throw new Error(message);
        }
        render(answer.body.value);
      })
      .catch(function (error) {
        setStatus('图谱加载失败：' + (error && error.message ? error.message : error), true);
      });
  }

  load();
</script>
</body>
</html>
